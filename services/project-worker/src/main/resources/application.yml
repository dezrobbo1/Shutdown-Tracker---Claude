spring:
  application:
    name: shutdown-tracker-project-worker
  # The worker holds no state and touches no database. It inherits spring-boot-starter-jdbc,
  # Flyway and the PostgreSQL driver from the build, and Boot will try to configure a DataSource
  # from their presence alone — so without this the process fails to start with "Failed to
  # configure a DataSource", whether launched from its own Dockerfile or from the jar. Only the
  # test profile excluded them, so that failure was invisible to every check.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
    parser:
      strict-duplicate-detection: true
  flyway:
    enabled: false

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

shutdown-tracker:
  worker-auth:
    enabled: ${SHUTDOWN_TRACKER_WORKER_AUTH_ENABLED:true}
    shared-secret: ${SHUTDOWN_TRACKER_WORKER_AUTH_SHARED_SECRET:}
  worker-storage:
    source-file-root: ${SHUTDOWN_TRACKER_SOURCE_FILE_STORAGE_LOCAL_ROOT:.shutdown-tracker/source-files}
    export-artifact-root: ${SHUTDOWN_TRACKER_EXPORT_ARTIFACT_STORAGE_LOCAL_ROOT:.shutdown-tracker/export-artifacts}
