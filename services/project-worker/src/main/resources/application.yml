spring:
  application:
    name: shutdown-tracker-project-worker
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
    parser:
      strict-duplicate-detection: true
  flyway:
    enabled: false

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

shutdown-tracker:
  worker-auth:
    enabled: ${SHUTDOWN_TRACKER_WORKER_AUTH_ENABLED:true}
    shared-secret: ${SHUTDOWN_TRACKER_WORKER_AUTH_SHARED_SECRET:}
  worker-storage:
    source-file-root: ${SHUTDOWN_TRACKER_SOURCE_FILE_STORAGE_LOCAL_ROOT:.shutdown-tracker/source-files}
    export-artifact-root: ${SHUTDOWN_TRACKER_EXPORT_ARTIFACT_STORAGE_LOCAL_ROOT:.shutdown-tracker/export-artifacts}
