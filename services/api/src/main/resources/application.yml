spring:
  application:
    name: shutdown-tracker-api
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 60MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

shutdown-tracker:
  persistence:
    enabled: false
  source-file-validation:
    max-size-bytes: 52428800
  source-file-storage:
    local-root: ${SHUTDOWN_TRACKER_SOURCE_FILE_STORAGE_LOCAL_ROOT:.shutdown-tracker/source-files}
  project-parse-worker:
    enabled: ${SHUTDOWN_TRACKER_PROJECT_PARSE_WORKER_ENABLED:false}
    base-url: ${SHUTDOWN_TRACKER_PROJECT_PARSE_WORKER_BASE_URL:http://localhost:8081}
    parse-summary-path: ${SHUTDOWN_TRACKER_PROJECT_PARSE_WORKER_PARSE_SUMMARY_PATH:/worker/project-import/parse-summary}
    shared-secret: ${SHUTDOWN_TRACKER_WORKER_AUTH_SHARED_SECRET:}
    connect-timeout: ${SHUTDOWN_TRACKER_PROJECT_PARSE_WORKER_CONNECT_TIMEOUT:5s}
    read-timeout: ${SHUTDOWN_TRACKER_PROJECT_PARSE_WORKER_READ_TIMEOUT:2m}
  project-export-worker:
    enabled: ${SHUTDOWN_TRACKER_PROJECT_EXPORT_WORKER_ENABLED:false}
    base-url: ${SHUTDOWN_TRACKER_PROJECT_EXPORT_WORKER_BASE_URL:http://localhost:8081}
    generate-artifact-path: ${SHUTDOWN_TRACKER_PROJECT_EXPORT_WORKER_GENERATE_ARTIFACT_PATH:/worker/project-export/generate-artifact}
    shared-secret: ${SHUTDOWN_TRACKER_WORKER_AUTH_SHARED_SECRET:}
    connect-timeout: ${SHUTDOWN_TRACKER_PROJECT_EXPORT_WORKER_CONNECT_TIMEOUT:5s}
    read-timeout: ${SHUTDOWN_TRACKER_PROJECT_EXPORT_WORKER_READ_TIMEOUT:2m}
  export-artifact-storage:
    local-root: ${SHUTDOWN_TRACKER_EXPORT_ARTIFACT_STORAGE_LOCAL_ROOT:.shutdown-tracker/export-artifacts}
  review-project-bootstrap:
    enabled: ${SHUTDOWN_TRACKER_REVIEW_PROJECT_BOOTSTRAP_ENABLED:false}
    project-name: ${SHUTDOWN_TRACKER_REVIEW_PROJECT_BOOTSTRAP_PROJECT_NAME:Synthetic Review Project}
    description: ${SHUTDOWN_TRACKER_REVIEW_PROJECT_BOOTSTRAP_DESCRIPTION:Synthetic review project for local and review-environment setup only.}
    timezone: ${SHUTDOWN_TRACKER_REVIEW_PROJECT_BOOTSTRAP_TIMEZONE:UTC}
