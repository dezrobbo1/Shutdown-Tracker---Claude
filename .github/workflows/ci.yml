name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend-maven-test:
    name: Backend Maven test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Maven tests
        run: mvn test

  frontend-test-build:
    name: Frontend test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend apps
        run: npm run build

  migration-validation:
    name: Migration and export-integrity validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate clean install, populated upgrades, and export integrity
        run: bash scripts/db/validate-migrations.sh

      - name: Remove migration-validation containers and volumes
        if: always()
        run: docker compose -f infra/docker/docker-compose.postgres.yml down -v

  docker-image-build:
    name: Docker image build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: false

      - name: Build project worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/project-worker/Dockerfile
          push: false
